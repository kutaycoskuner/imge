# Builds the keyboard-only site's Docker image (Dockerfile, SITE=keyboard) on every push to
# main and pushes it to ghcr.io/kutaycoskuner/imge-keyboard, tagged latest and with the
# commit sha, then calls the homelab Portainer webhook (secret PORTAINER_WEBHOOK), which
# re-pulls latest and redeploys the keyboard site. Without the secret (e.g. a fork) that
# step is skipped. Can also be run by hand from the Actions tab (workflow_dispatch).
# Images for arm64 (the Pi) and amd64 (to test on a PC); the Node build stage runs only once,
# natively, so building both costs little. Details: docs/keyboard-site.md
# The GitHub Pages site is not affected: it is still built by hand onto the deploy branch.

name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/imge-keyboard:latest
            ghcr.io/${{ github.repository_owner }}/imge-keyboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # redeploy on the homelab: Portainer pulls the new latest; fails the run if Portainer doesn't answer
      - name: Redeploy on Portainer
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK" ]; then echo "no PORTAINER_WEBHOOK secret: redeploy skipped"; exit 0; fi
          curl -fsS -X POST "$PORTAINER_WEBHOOK"
