<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Set theme before loading CSS -->
		<script>
			const theme = localStorage.getItem('color-scheme');
			if (theme) {
				document.documentElement.setAttribute('color-scheme', theme);
			} else {
				localStorage.setItem('color-scheme', 'dark');
				document.documentElement.setAttribute('color-scheme', 'dark');
			}
		</script>

		<link rel="stylesheet" href="%sveltekit.assets%/styles/main.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/styles/settings_overlay.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/styles/imge.css" />

		<!-- analytics (archrium): counts visits on the live site only (data-domains) -->
		<script
			defer
			src="https://analytics.archrium.net/script.js"
			data-website-id="46199731-2117-40f5-93fa-d74ecf1ac920"
			data-domains="kutaycoskuner.github.io"
		></script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
